name: Build 10021021 refined competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10021021_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build refined editable PPT
        run: python scripts/build_ppt_10021021.py
      - name: Commit PPT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10021021PPT完善版"
          git commit -m "Add 10021021 refined 3S-master competition PPT" || exit 0
          git pull --rebase origin main
          git push
