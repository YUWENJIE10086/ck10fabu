name: Final visual-review PPT 10021734

on:
  push:
    paths:
      - 'scripts/MICROFIX_BLUEWHITE_10021734_READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx lxml
      - run: python scripts/microfix_bluewhite_10021734.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          from pathlib import Path
          from pptx import Presentation
          p=Path('决赛发布材料/1002PPT决赛完善版/智烤管家_10021734_创客25逐图学习蓝白视觉复核终稿.pptx')
          prs=Presentation(p)
          assert len(prs.slides)==15
          print('slides=',len(prs.slides),'bytes=',p.stat().st_size)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '决赛发布材料/1002PPT决赛完善版/智烤管家_10021734_创客25逐图学习蓝白视觉复核终稿.pptx'
          git commit -m 'Finalize PPT after 15-page visual review'
          git push origin HEAD:main
