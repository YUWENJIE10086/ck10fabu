name: Package PPT 10021714

on:
  push:
    paths:
      - 'scripts/PACKAGE_PPT_10021714_READY'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Package final deck and preview
        uses: actions/upload-artifact@v4
        with:
          name: 智烤管家_10021714_蓝白母版重做版
          path: |
            决赛发布材料/1002PPT决赛完善版/智烤管家_10021714_创客25逐图学习蓝白母版重做版.pptx
            决赛发布材料/1002PPT决赛完善版/预览_10021714/智烤管家_10021714_蓝白母版重做版_15页预览.pdf
          if-no-files-found: error
