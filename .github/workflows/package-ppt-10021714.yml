name: Package 1003 source PPTs

on:
  push:
    branches: [main]
    paths:
      - 'scripts/PACKAGE_PPT_10021714_READY'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload 1003 source decks
        uses: actions/upload-artifact@v4
        with:
          name: zhikao-1003-sources
          path: |
            决赛发布材料/1002PPT决赛完善版/1003/智烤管家_142106_1比1蓝白山海光路抠图还原版_副本2.pptx
            决赛发布材料/1002PPT决赛完善版/1003/智烤管家_142106_1比1蓝白山海光路抠图还原版_副本3.pptx
