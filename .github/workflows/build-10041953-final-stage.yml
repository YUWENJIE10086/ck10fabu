name: Build 10041953 final-stage package

on:
  push:
    paths:
      - '.github/workflows/build-10041953-final-stage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install python-pptx python-docx pillow

      - name: Restore verified generator and source media
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /mnt/data /mnt/data/ck10_src/1004 /mnt/data/111_media /mnt/data/report_media
          printf '%s' '' > /tmp/ck10-build.tgz.b64
          base64 -d /tmp/ck10-build.tgz.b64 > /tmp/ck10-build.tgz
          tar -xzf /tmp/ck10-build.tgz -C /mnt/data
          cp -a 1004/. /mnt/data/ck10_src/1004/

          python - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path('/mnt/data/ck10_src/1004')
          with zipfile.ZipFile(root/'111.pptx') as z:
              for name in ('ppt/media/image1.jpg', 'ppt/media/image2.png'):
                  Path('/mnt/data/111_media', Path(name).name).write_bytes(z.read(name))

          report = root/'附件2：宜昌市局+智烤管家-基于健康评估的烤房用投管一体化解决方案+数创成果报告.docx'
          with zipfile.ZipFile(report) as z:
              for name in z.namelist():
                  if name.startswith('word/media/') and not name.endswith('/'):
                      Path('/mnt/data/report_media', Path(name).name).write_bytes(z.read(name))
          PY

      - name: Build final PPT, Word package and speaker notes
        run: |
          set -euo pipefail
          python /mnt/data/add_notes_ck10.py
          test -f "/mnt/data/10041953_智烤管家创客决赛_上台一体版/10041953_智烤管家创客决赛_上台一体版.pptx"
          test -f "/mnt/data/10041953_智烤管家创客决赛_上台一体版/10041953_智烤管家创客决赛_评委高压追问与备答.docx"

      - name: Copy package into 1004 and create ZIP
        shell: bash
        run: |
          set -euo pipefail
          DIR="10041953_智烤管家创客决赛_上台一体版"
          mkdir -p "1004/$DIR"
          cp -a "/mnt/data/$DIR/." "1004/$DIR/"
          (cd 1004 && zip -r /tmp/10041953-package.zip "$DIR" -x "$DIR/10041953_整套交付.zip" >/dev/null)
          cp /tmp/10041953-package.zip "1004/$DIR/10041953_整套交付.zip"

      - name: Commit generated binary deliverables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "1004/10041953_智烤管家创客决赛_上台一体版"
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "build: add 10041953 final-stage PPT and Word package"
            git push
          fi
