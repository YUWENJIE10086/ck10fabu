name: Temp extract sources 09301036
on:
  push:
    paths:
      - 'scripts/TEMP_EXTRACT_09301036_READY'
permissions:
  contents: write
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install python-docx
      - run: sudo apt-get update && sudo apt-get install -y antiword
      - run: python scripts/temp_extract_09301036.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_sources_09301036
          git commit -m "Temp extract 09301036 source texts" || exit 0
          git push
