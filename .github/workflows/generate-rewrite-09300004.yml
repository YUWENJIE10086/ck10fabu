name: Generate rewrite 09300004
on:
  push:
    paths:
      - 'scripts/rewrite_09300004/READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - name: Decode generator and generate docs
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/rewrite_09300004/generator_b64_part_*.txt | tr -d '\n\r' | base64 -d > /tmp/generate_docs.py
          python /tmp/generate_docs.py
      - name: Commit deliverables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/09300004发布稿"
          git commit -m "Add 09300004 competition rewrite" || exit 0
          git push
