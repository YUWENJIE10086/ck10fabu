
name: Extract competition source texts
on:
  push:
    paths:
      - 'scripts/extract_competition_sources/READY'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx python-pptx
      - run: sudo apt-get update && sudo apt-get install -y antiword
      - run: python scripts/extract_competition_sources/extract.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .analysis_extract_0930
          git commit -m "Extract source texts for competition rewrite" || exit 0
          git push
