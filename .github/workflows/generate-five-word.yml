name: Generate five competition Word drafts

on:
  push:
    paths:
      - 'scripts/competition_doc_parts/READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document dependency
        run: pip install python-docx
      - name: Assemble generator and create Word files
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/competition_doc_parts/part_*.txt > /tmp/generate_competition_docs.py
          python /tmp/generate_competition_docs.py
      - name: Commit generated deliverables
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/0929五版发布稿"
          git commit -m "Add five competition final Word drafts" || exit 0
          git push
