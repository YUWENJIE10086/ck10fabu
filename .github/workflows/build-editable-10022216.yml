name: Build 1to1 editable Zhikao PPT 10022216

on:
  push:
    branches: [main]
    paths:
      - 'scripts/BUILD_EDITABLE_10022216_READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install python-pptx python-docx pillow
      - name: Build 1to1 editable decks and Word guide
        run: python scripts/build_editable_10022216.py
      - name: Move outputs into final folder
        shell: bash
        run: |
          set -euo pipefail
          DEST='决赛发布材料/1002PPT决赛完善版'
          mkdir -p "$DEST"
          mv '智烤管家_10022216_10021912原视觉全组件可编辑还原版.pptx' "$DEST/"
          mv '智烤管家_10022216_全组件可编辑减光路8分钟优化版.pptx' "$DEST/"
          mv '智烤管家_10022216_8分钟逐页演讲建议与素材补充说明.docx' "$DEST/"
          cat > "$DEST/10021912_1比1全组件可编辑重绘说明_10022216.md" <<'EOF'
          # 智烤管家 10021912｜1:1全组件可编辑重绘（10022216）

          本轮以 `智烤管家_10021912_蓝白山海光路无框视觉决赛版.pptx` 为唯一视觉基准。

          ## 原文件事实
          原 `10021912` 的15页主体均为整页 JPG，因此无法直接“取消组合”获得文字、图标、图表等原生对象。本轮采用逐项重绘：
          - 仅背景允许保留为图片；
          - 标题、副标题、序号、说明文字、图标、节点、箭头、流程线、地图示意、柱状图、雷达图、手机界面、数据面板、KPI数字等全部重画为 PowerPoint 原生可编辑组件；
          - 每页严格检查只有1个图片对象，即背景；前景不存在不可编辑图片。

          ## 两个版本
          1. `智烤管家_10022216_10021912原视觉全组件可编辑还原版.pptx`
             - 目标：尽可能保持10021912的布局、蓝白标题、山海舞台、光路层级与信息关系。
          2. `智烤管家_10022216_全组件可编辑减光路8分钟优化版.pptx`
             - 第1—2页保留强舞台光路；第3—15页压暗/减少底部大光路。
             - 口径按《智烤管家演讲讲稿9.30》统一，适配8分钟决赛。
          3. `智烤管家_10022216_8分钟逐页演讲建议与素材补充说明.docx`
             - 逐页口播、A/B角色、建议时长、临场动作、图片/视频补充建议。

          ## 可编辑性
          两份PPT中背景为唯一允许的图片。前景均为原生文本框、形状、连接线和数据图形，可以逐个选择、移动、改字、改色、缩放。
          EOF
      - name: Validate editable foreground
        shell: bash
        run: |
          python - <<'PY'
          import zipfile, pathlib
          root=pathlib.Path('决赛发布材料/1002PPT决赛完善版')
          for p in [
              root/'智烤管家_10022216_10021912原视觉全组件可编辑还原版.pptx',
              root/'智烤管家_10022216_全组件可编辑减光路8分钟优化版.pptx']:
              with zipfile.ZipFile(p) as z:
                  assert z.testzip() is None
                  media=[n for n in z.namelist() if n.startswith('ppt/media/') and not n.endswith('/')]
                  slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
                  assert 1 <= len(media) <= 2, media
                  for n in slides:
                      assert z.read(n).count(b'<p:pic') == 1, (n, z.read(n).count(b'<p:pic'))
                  print('OK', p.name, 'background_media=', len(media), 'slides=', len(slides))
          PY
      - name: Commit generated results
        shell: bash
        run: |
          git config user.name 'YUWENJIE10086'
          git config user.email '44671256+YUWENJIE10086@users.noreply.github.com'
          git add '决赛发布材料/1002PPT决赛完善版'
          git commit -m 'Add 1to1 editable Zhikao deck and 8-minute guide 10022216'
          git push
