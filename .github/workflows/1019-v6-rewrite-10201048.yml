name: CK10 V6 Complete Rewrite 20261020
on:
  push:
    paths:
      - '.github/v6_rebuild_source/build_10201048.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document QA requirements
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk
          python -m pip install -q python-docx pymupdf
      - name: Wipe old V6 then generate new deliverables
        run: python ".github/v6_rebuild_source/build_10201048.py"
      - name: Verify Word, data and layout
        run: |
          mkdir -p /tmp/ck10newv6
          libreoffice -env:UserInstallation=file:///tmp/ck10v6newlo --headless --convert-to pdf --outdir /tmp/ck10newv6 "1019/v6/修改稿/10201048_04_V6约2000字AB决赛完整版.docx" "1019/v6/修改稿/10201048_05_V6八分钟AB正式上场稿.docx" "1019/v6/修改稿/10201048_05B_V6_25页PPT双人舞台稿.docx"
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import re,tarfile,pymupdf
          root=Path('1019/v6/修改稿')
          files=sorted(root.glob('*.docx'))
          assert len(files)==8,[f.name for f in files]
          count=lambda s:len(re.findall('[\u4e00-\u9fff]',s))
          reports=[]
          for f,exp in [('10201048_04_V6约2000字AB决赛完整版.docx',(1411,599)),('10201048_05_V6八分钟AB正式上场稿.docx',(1148,511))]:
            d=Document(root/f)
            a=sum(count(p.text[2:]) for p in d.paragraphs if p.text.startswith('A：'))
            b=sum(count(p.text[2:]) for p in d.paragraphs if p.text.startswith('B：'))
            assert (a,b)==exp,(f,a,b)
            assert .68 < a/(a+b) < .72
            alltext='\n'.join(p.text for p in d.paragraphs)
            assert not any(x in alltext for x in ('作为评委','站在评委','我更想追问'))
            reports.append(f'{f}: A={a} B={b} {a/(a+b)*100:.2f}%')
          research=Document(root/'10201048_02_5万字项目全文件研究与技术增订.docx')
          official=Document(root/'10201048_03_官方叙述规范1万字研究校订.docx')
          rc=sum(count(p.text) for p in research.paragraphs)
          oc=sum(count(p.text) for p in official.paragraphs)
          assert rc>=50000 and len(research.inline_shapes)>=8,(rc,len(research.inline_shapes))
          assert oc>=10000 and len(official.inline_shapes)>=3,(oc,len(official.inline_shapes))
          reports.extend([f'项目研究={rc}汉字，{len(research.inline_shapes)}幅图',f'官方研究={oc}汉字，{len(official.inline_shapes)}幅图'])
          for p in Path('/tmp/ck10newv6').glob('*.pdf'):
            pdf=pymupdf.open(p)
            assert 2<=len(pdf)<=6 and all(len(page.get_text().strip())>5 for page in pdf),(p.name,len(pdf))
            reports.append(f'{p.name}={len(pdf)}页无空白')
          archive=root/'10201048_智烤管家V6全套8份Word.tar.gz'
          with tarfile.open(archive,'r:gz') as z:
            assert len([x for x in z.getmembers() if x.name.endswith('.docx')])==8
          reports.append('旧V6清理，未有残留旧Word')
          (root/'10201048_验收通过.md').write_text('\n'.join(reports),encoding='utf8')
          print('\n'.join(reports))
          PY
      - name: Remove superseded V6 build scripts and workflows
        run: |
          rm -f .github/workflows/1019-v6-reset-rebuild.yml
          rm -f .github/v6_rebuild_source/build_v6_clean.py
          rm -f .github/v6_rebuild_source/10201024_V6_重建发布稿.md
      - name: Commit checked files and deletions to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '1019/v6' '.github/v6_rebuild_source' '.github/workflows'
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'V6 rebuilt from 9.30: 2000-char professional AB draft and 8-minute version'
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then break; fi
              sleep 5
            done
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          fi
