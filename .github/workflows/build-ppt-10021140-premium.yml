name: Build 10021140 premium competition PPT
on:
  push:
    paths:
      - 'scripts/PREMIUM_PPT_10021140_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Decode premium generator
        run: |
          cat scripts/PREMIUM_PPT_10021140_1.b64 scripts/PREMIUM_PPT_10021140_2.b64 scripts/PREMIUM_PPT_10021140_3.b64 scripts/PREMIUM_PPT_10021140_4.b64 > /tmp/premium.b64
          base64 -d /tmp/premium.b64 | gzip -d > /tmp/build_premium.py
      - name: Build premium editable PPT
        run: python /tmp/build_premium.py
      - name: Commit premium PPT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/1002PPT决赛完善版/智烤管家_10021140_高级科技内容深化版.pptx"
          git commit -m "Add 10021140 premium competition PPT" || exit 0
          git pull --rebase origin main
          git push
