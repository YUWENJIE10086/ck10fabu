name: Build 10021140 premium competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10021140_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Reconstruct builder
        run: |
          cat scripts/.tmp_10021140_1.py scripts/.tmp_10021140_2.py scripts/.tmp_10021140_3.py scripts/.tmp_10021140_4.py scripts/.tmp_10021140_5.py scripts/.tmp_10021140_6.py scripts/.tmp_10021140_7a.py scripts/.tmp_10021140_7b.py > /tmp/build_ppt_10021140.py
          python -m py_compile /tmp/build_ppt_10021140.py
      - name: Build editable premium PPT
        run: python /tmp/build_ppt_10021140.py
      - name: Commit final PPT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/1002PPT决赛完善版/智烤管家_10021140_高级科技动态一等奖精修版.pptx"
          git commit -m "Add 10021140 premium dynamic competition PPT" || exit 0
          git pull --rebase origin main
          git push
