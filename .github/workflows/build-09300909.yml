name: Build 09300909 competition speech
on:
  push:
    paths:
      - 'scripts/BUILD_09300909_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python scripts/build_09300909.py
      - name: Clean temporary extraction files
        shell: bash
        run: |
          git rm -rf --ignore-unmatch .tmp_sources_09300909
          git rm -rf --ignore-unmatch scripts/temp_extract_09300909.py
          git rm -rf --ignore-unmatch scripts/TEMP_EXTRACT_09300909_READY
          git rm -f --ignore-unmatch .github/workflows/temp-extract-09300909.yml
      - name: Commit final Word
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/09300909发布稿"
          git commit -m "Add 09300909 final competition speech Word" || exit 0
          git push
