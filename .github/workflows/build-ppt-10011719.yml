name: Build 10011719 redesigned competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10011719_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build redesigned editable PPT decks
        shell: bash
        run: |
          python - <<'PY'
          import base64,gzip
          payload=''
          code=gzip.decompress(base64.b64decode(payload)).decode('utf-8')
          open('/tmp/build_ppt_10011719.py','w',encoding='utf-8').write(code)
          PY
          python /tmp/build_ppt_10011719.py
      - name: Clean temporary assets
        run: rm -rf .tmp_ppt_assets_10011719
      - name: Commit redesigned PPT decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10011719PPT重做版"
          git commit -m "Add 10011719 redesigned blue-master competition PPT decks" || exit 0
          git push
