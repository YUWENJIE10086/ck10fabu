name: Build 10012107 clean minimal competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_CLEAN_10012107_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Decode clean minimal PPT generator
        shell: bash
        run: |
          python - <<'PY2'
          import base64,gzip
          payload = """"""
          open('/tmp/build_clean_10012107.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY2
      - name: Build clean minimal editable PPT
        run: python /tmp/build_clean_10012107.py
      - name: Commit clean minimal PPT
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add "决赛发布材料/10012107PPT极简重构版"
          git commit -m "Add 10012107 clean minimal competition PPT" || exit 0
          git push
