name: Temp extract video and margin 0941
on:
  push:
    paths: ['scripts/TEMP_VIDEO_0941_READY']
permissions: {contents: write}
jobs:
  x:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install python-docx
      - run: python scripts/temp_video_0941.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp_video_0941
          git commit -m "Temp extract video scripts and official margins" || exit 0
          git push
