name: Build 10011941 native-master competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10011941_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build native-master editable PPT
        run: python scripts/build_ppt_10011941.py
      - name: Write full 401-image style index
        run: python scripts/write_style_index_10011941.py
      - name: Clean temporary analysis/listing workflow files
        run: |
          git rm -f --ignore-unmatch .github/workflows/list-ppt-assets-10011941.yml scripts/LIST_PPT_ASSETS_10011941_READY
          git rm -f --ignore-unmatch .github/workflows/analyze-creative25-10011941.yml scripts/ANALYZE_CREATIVE25_10011941_READY scripts/analyze_creative25_10011941.py
      - name: Commit final deck and study index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10011941PPT母版原生融合版"
          git add -u
          git commit -m "Add 10011941 native-master final competition PPT and style study" || exit 0
          git push
