name: export-1009-materials
on:
  push:
    paths:
      - '.github/workflows/export-1009-materials.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack reference materials
        run: |
          mkdir -p export
          cp -r "读取资料/2我的项目相关的零碎的" export/
          cp -r "ppt参考" export/
          zip -r 1009-reference-materials.zip export >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: 1009-reference-materials
          path: 1009-reference-materials.zip
