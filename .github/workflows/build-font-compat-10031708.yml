name: Build font-compatible PPT 10031708

on:
  push:
    branches: [main]
    paths:
      - 'scripts/BUILD_FONT_COMPAT_10031708_READY'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install python-pptx
      - name: Build font-compatible PPT
        run: python scripts/build_font_compat_10031708.py
      - name: Move result into 1003 folder
        shell: bash
        run: |
          set -euo pipefail
          DEST='决赛发布材料/1002PPT决赛完善版/1003'
          mv '智烤管家_10031708_A版精修_通用字体兼容版_微软雅黑Arial_渐变可编辑.pptx' "$DEST/"
      - name: Commit generated PPT
        shell: bash
        run: |
          git config user.name 'YUWENJIE10086'
          git config user.email '44671256+YUWENJIE10086@users.noreply.github.com'
          git add '决赛发布材料/1002PPT决赛完善版/1003'
          git commit -m 'Add font-compatible refined A deck 10031708'
          git push
