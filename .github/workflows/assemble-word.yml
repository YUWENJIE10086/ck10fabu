name: Assemble Word artifact
on:
  push:
    paths:
      - '.upload_chunks/READY'
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Assemble DOCX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "决赛发布材料"
          cat .upload_chunks/chunk_*.txt | tr -d '\n\r' | base64 -d > "决赛发布材料/智烤管家_湖北省创客大赛决赛_双人8分钟发布稿_详细版_v1_0929.docx"
          test -s "决赛发布材料/智烤管家_湖北省创客大赛决赛_双人8分钟发布稿_详细版_v1_0929.docx"
          rm -rf .upload_chunks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add detailed 8-minute final speech Word document"
          git push
