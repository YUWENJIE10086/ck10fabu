name: Build 10021021 final speech-aligned PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10021021_FINAL_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build final editable PPT
        run: python scripts/build_ppt_10021021_final.py
      - name: Commit final PPT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10021021PPT演讲稿融合深化版"
          git commit -m "Add 10021021 speech-aligned final competition PPT" || exit 0
          git pull --rebase origin main
          git push
