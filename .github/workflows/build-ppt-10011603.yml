name: Build 10011603 competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10011603_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build editable PPT decks
        run: python scripts/build_ppt_10011603.py
      - name: Clean temporary source packaging files
        run: |
          git rm -f --ignore-unmatch .github/workflows/package-ppt-sources-10011603.yml
          git rm -f --ignore-unmatch scripts/PACKAGE_PPT_SOURCES_10011603_READY
      - name: Commit PPT decks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10011603PPT"
          git commit -m "Add 10011603 editable final competition PPT decks" || exit 0
          git push
