name: Build 09300950 official-mainline competition speech
on:
  push:
    paths:
      - 'scripts/BUILD_09300950_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python scripts/build_09300950.py
      - name: Clean temporary inspection files
        shell: bash
        run: |
          git rm -f --ignore-unmatch scripts/inspect_official_layout_09300950.py
          git rm -f --ignore-unmatch scripts/INSPECT_OFFICIAL_09300950_READY
          git rm -f --ignore-unmatch .github/workflows/inspect-official-layout-09300950.yml
      - name: Commit Word
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/09300950发布稿"
          git add -u
          git commit -m "Add 09300950 official-mainline competition speech Word" || exit 0
          git push
