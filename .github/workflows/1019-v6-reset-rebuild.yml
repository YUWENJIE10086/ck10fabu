name: CK10 V6 Clean Rebuild
on:
  push:
    paths:
      - '.github/v6_rebuild_source/build_v6_clean.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Document prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk
          python -m pip install -q python-docx pymupdf pillow
      - name: Replace V6 from a clean directory
        run: python ".github/v6_rebuild_source/build_v6_clean.py"
      - name: Check all seven Word files and render speech
        run: |
          mkdir -p /tmp/ck10v6resetpdf
          libreoffice -env:UserInstallation=file:///tmp/ck10v6resetlo --headless --convert-to pdf --outdir /tmp/ck10v6resetpdf "1019/v6/修改稿/10201024_04_V6重建_8分钟双人正式演讲净稿.docx" "1019/v6/修改稿/10201024_05_V6重建_25页PPT双人舞台稿.docx"
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import re,tarfile,pymupdf,sys
          folder=Path('1019/v6/修改稿')
          docx=sorted(folder.glob('*.docx'))
          assert len(docx)==7,[x.name for x in docx]
          manuscript=Document(folder/'10201024_04_V6重建_8分钟双人正式演讲净稿.docx')
          a=sum(len(re.findall('[\u4e00-\u9fff]',p.text[2:])) for p in manuscript.paragraphs if p.text.startswith('A：'))
          b=sum(len(re.findall('[\u4e00-\u9fff]',p.text[2:])) for p in manuscript.paragraphs if p.text.startswith('B：'))
          assert (a,b)==(1057,444),(a,b)
          text='\n'.join(p.text for p in manuscript.paragraphs)
          assert '作为评委' not in text and '评委更想' not in text and '站在评委' not in text
          proj=Document(folder/'10201024_02_项目五万字级深度研究及V6创新增订.docx')
          off=Document(folder/'10201024_03_官方叙述一万字级规范研究与QC校订.docx')
          pc=sum(len(re.findall('[\u4e00-\u9fff]',p.text)) for p in proj.paragraphs)
          oc=sum(len(re.findall('[\u4e00-\u9fff]',p.text)) for p in off.paragraphs)
          assert pc>=50000 and len(proj.inline_shapes)>=8,(pc,len(proj.inline_shapes))
          assert oc>=10000 and len(off.inline_shapes)>=3,(oc,len(off.inline_shapes))
          pages=[]
          for f in sorted(Path('/tmp/ck10v6resetpdf').glob('*.pdf')):
              z=pymupdf.open(f)
              assert 2<=len(z)<=6 and all(len(p.get_text().strip())>4 for p in z),(f.name,len(z))
              pages.append(f'{f.name}={len(z)}页')
          tar=folder/'10201024_智烤管家V6重建_七份Word.tar.gz'
          assert tar.exists() and tar.stat().st_size>1000000
          with tarfile.open(tar,'r:gz') as z: assert len([m for m in z.getmembers() if m.name.endswith('.docx')])==7
          (folder/'10201024_验收结果.md').write_text(f'A={a} B={b} 占比={a/(a+b)*100:.2f}%\\n项目研究={pc}汉字，{len(proj.inline_shapes)}图\\n官方研究={oc}汉字，{len(off.inline_shapes)}图\\n渲染：{pages}\\n旧V6文件已清理并重建，无突兀评委身份台词。',encoding='utf8')
          print('V6 clean QA passed',a,b,pc,oc,pages,tar.stat().st_size)
          PY
      - name: Remove previous V6-associated workflows
        run: |
          rm -f .github/workflows/1019-v6-extract-evidence.yml
          rm -f .github/workflows/1019-v6-final-release.yml
          rm -f .github/workflows/1019-v6-word-deliverables.yml
      - name: Commit only the new V6 version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A '1019/v6' '.github/workflows'
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m 'V6 reset: delete old content and publish revised natural-AB competition script'
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then break; fi
              sleep 5
            done
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          fi
