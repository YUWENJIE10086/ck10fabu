name: Inspect official layout 09300950
on:
  push:
    paths:
      - 'scripts/INSPECT_OFFICIAL_09300950_READY'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install python-docx
      - run: python scripts/inspect_official_layout_09300950.py > official_layout_09300950.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-layout-09300950
          path: official_layout_09300950.txt
