name: 1019 Generate Reviewed Word Documents
on:
  push:
    branches: [main]
    paths:
      - '1019/1019*.md'
      - '1019/publish_docs.py'
      - '.github/workflows/1019-word-publish.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word library
        run: pip install python-docx==1.2.0
      - name: Build Word deliverables
        run: python 1019/publish_docs.py
      - name: Commit generated Word files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '1019/*.docx'
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish 1019 editable Word deliverables"
            git push
          fi
