name: CK10 V6 2000-word Definitive Rebuild
on:
  push:
    paths:
      - '.github/v6_2000_release/build_release.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Word and QA tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libreoffice-writer fonts-noto-cjk
          python -m pip install -q python-docx pymupdf
      - name: Clean old V6, rebuild from original and official sources
        run: python .github/v6_2000_release/build_release.py
      - name: Verify source-grounded output and render all speech versions
        run: |
          mkdir -p /tmp/v6_2000_pdf
          libreoffice -env:UserInstallation=file:///tmp/v6_2000_lo --headless --convert-to pdf --outdir /tmp/v6_2000_pdf "1019/v6/修改稿/10201048_04_V6_约2000字专业完整版.docx" "1019/v6/修改稿/10201048_05_V6_8分钟彩排净稿.docx" "1019/v6/修改稿/10201048_06_V6_25页PPT对应舞台稿.docx"
          python - <<'PY'
          from pathlib import Path
          from docx import Document
          import re,tarfile,pymupdf
          r=Path('1019/v6/修改稿')
          docs=sorted(r.glob('*.docx'))
          assert len(docs)==7,[p.name for p in docs]
          nums=[]
          for p in docs[3:6]: pass
          for name,target in [('04_V6_约2000字专业完整版.docx',(1384,594)),('05_V6_8分钟彩排净稿.docx',(1098,474))]:
            p=r/('10201048_'+name)
            d=Document(p)
            a=sum(len(re.findall('[\u4e00-\u9fff]',q.text[2:])) for q in d.paragraphs if q.text.startswith('A：'))
            b=sum(len(re.findall('[\u4e00-\u9fff]',q.text[2:])) for q in d.paragraphs if q.text.startswith('B：'))
            assert (a,b)==target,(name,a,b)
            assert 0.69<a/(a+b)<0.71,(name,a,b)
            assert '作为评委' not in '\n'.join(q.text for q in d.paragraphs)
            nums.append(f'{name}: A={a},B={b},A占比={100*a/(a+b):.2f}%')
          proj=Document(r/'10201048_02_五万字项目研究底稿及V6实效增订.docx')
          off=Document(r/'10201048_03_一万字官方叙述研究及成果数字校订.docx')
          pc=sum(len(re.findall('[\u4e00-\u9fff]',p.text)) for p in proj.paragraphs)
          oc=sum(len(re.findall('[\u4e00-\u9fff]',p.text)) for p in off.paragraphs)
          assert pc>=50000 and len(proj.inline_shapes)>=8,(pc,len(proj.inline_shapes))
          assert oc>=10000 and len(off.inline_shapes)>=3,(oc,len(off.inline_shapes))
          seen=[]
          for p in sorted(Path('/tmp/v6_2000_pdf').glob('*.pdf')):
            doc=pymupdf.open(p)
            assert 2<=len(doc)<=8 and all(len(page.get_text().strip())>5 for page in doc),(p.name,len(doc))
            seen.append(f'{p.name}: {len(doc)}页')
          assert len(seen)==3,seen
          archive=r/'10201048_智烤管家V6_七份Word完整包.tar.gz'
          assert archive.stat().st_size>1000000,archive.stat().st_size
          with tarfile.open(archive,'r:gz') as z:
            assert len([m for m in z.getmembers() if m.name.endswith('.docx')])==7
          report='\n'.join(['# 新V6精修验收',*nums,f'项目研究: {pc}个汉字 / {len(proj.inline_shapes)}图',f'官方叙述: {oc}个汉字 / {len(off.inline_shapes)}图',*seen,'2000字完整版不宣称8分钟完成；彩排版含视频预算接近8分钟；最终以实测为准。'])
          (r/'10201048_渲染与需求核对结果.md').write_text(report,encoding='utf-8')
          print(report)
          PY
      - name: Remove outdated V6 workflows and commit definitive V6
        run: |
          rm -f .github/workflows/1019-v6-reset-rebuild.yml
          rm -f .github/workflows/1019-v6-word-deliverables.yml
          rm -f .github/workflows/1019-v6-final-release.yml
          rm -f .github/workflows/1019-v6-extract-evidence.yml
          rm -rf .github/v6_rebuild_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A 1019/v6 .github/workflows .github/v6_rebuild_source
          if ! git diff --cached --quiet; then
            git commit -m '1019/v6: clean reset, 1978-character authoritative version, 1572-character rehearsal, seven verified Word files'
            for n in 1 2 3 4 5; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then break; fi
              sleep 5
            done
            git fetch origin main
            test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)"
          fi
