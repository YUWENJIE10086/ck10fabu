name: Analyze Creative25 images 10011941
on:
  push:
    paths:
      - 'scripts/ANALYZE_CREATIVE25_10011941_READY'
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow
      - name: Unzip Creative25 into new folder
        run: |
          mkdir -p '创客25图片_解压_10011941'
          unzip -q '创客25图片.zip' -d '创客25图片_解压_10011941'
          find '创客25图片_解压_10011941' -maxdepth 2 -type f | sed -n '1,120p'
      - name: Build per-image thumbnails and contact sheets
        run: python scripts/analyze_creative25_10011941.py
      - uses: actions/upload-artifact@v4
        with:
          name: creative25-analysis-10011941
          path: creative25_analysis_10011941
          compression-level: 6
