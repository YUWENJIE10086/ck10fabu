name: CK10 V6 Extract QC and Source Evidence
on:
  push:
    paths:
      - '1019/v6/资料提取工具.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  read-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q python-docx python-pptx
      - name: Extract original QC, 9.30, official sources and source inventory
        run: python '1019/v6/资料提取工具.py'
      - name: Publish extraction
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '1019/v6/修改稿/资料取证'
          if ! git diff --cached --quiet; then
            git commit -m 'v6: extract QC speech and original source evidence'
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase FETCH_HEAD
              if git push origin HEAD:main; then break; fi
              sleep 4
            done
          fi
