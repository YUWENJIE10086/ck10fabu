name: Build 09301036 competition speech
on:
  push:
    paths:
      - 'scripts/BUILD_09301036_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-docx
      - run: python scripts/build_09301036.py
      - name: Clean temp extraction
        run: |
          git rm -rf --ignore-unmatch .tmp_sources_09301036
          git rm -f --ignore-unmatch scripts/temp_extract_09301036.py
          git rm -f --ignore-unmatch scripts/TEMP_EXTRACT_09301036_READY
          git rm -f --ignore-unmatch .github/workflows/temp-extract-09301036.yml
      - name: Commit Word
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/09301036发布稿"
          git commit -m "Add 09301036 refined competition speech Word" || exit 0
          git push
