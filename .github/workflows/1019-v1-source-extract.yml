name: CK10 1019 V1 Source Analysis
on:
  push:
    paths:
      - '1019/v1/*_源材料提取器.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install parser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y antiword
          pip install python-docx python-pptx beautifulsoup4 lxml openpyxl xlrd pymupdf
      - name: Extract all requested sources
        run: python "1019/v1/10192000_源材料提取器.py"
      - name: Commit traced source analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "1019/v1/"
          git diff --cached --quiet || (git commit -m "1019/v1: 保存逐文件提取文字与原稿版式参数" && git push)
