name: Build 10012107 native-master competition PPT
on:
  push:
    paths:
      - 'scripts/BUILD_PPT_10012107_READY'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install python-pptx pillow
      - name: Build editable PPT from original 3S master
        run: python scripts/build_ppt_10012107.py
      - name: Commit final PPT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "决赛发布材料/10012107PPT母版原生组件版"
          git commit -m "Add 10012107 original-master editable competition PPT" || true
          git pull --rebase origin main
          git push origin main
